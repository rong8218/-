<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>社會情緒訓練 黑白版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: a single phone-width chat column; the log fades with each loop while the unanswered question stays pinned at full strength above the choices. */
:root{
  --bg:#EDEDED; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B6B; --line:#D4D4D4;
  --them:#E0E0E0; --accent:#2B2B2B; --on-accent:#FFFFFF; --soft:#E6E6E6;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --fade:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1C1C1C; --ink:#E8E8E8; --muted:#8F8F8F; --line:#303030;
  --them:#262626; --accent:#D9D9D9; --on-accent:#111111; --soft:#242424; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1C1C1C; --ink:#E8E8E8; --muted:#8F8F8F; --line:#303030;
  --them:#262626; --accent:#D9D9D9; --on-accent:#111111; --soft:#242424; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
*{box-sizing:border-box}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.screen{height:100%;overflow-y:auto}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px}

/* Intro */
.intro .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:40px}
.intro h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,40px);line-height:1.25;margin:0;text-wrap:balance}
.intro p{margin:0;max-width:34em}
.intro .lede{font-family:var(--serif);font-size:17px}
.intro .small{color:var(--muted);font-size:13px}
.starts{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.btn-quiet{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:11px 20px;font-size:14px}
.btn-quiet:hover{border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 28px;font-weight:500;align-self:flex-start}

/* App */
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-inline:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.top .name{font-weight:700;font-size:15px}
.top .work{color:var(--muted);font-size:12px;letter-spacing:.06em}
.steps{display:flex;gap:5px}
.steps i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:16px;
  opacity:calc(1 - var(--fade) * .65);filter:saturate(calc(1 - var(--fade)));transition:opacity 1.2s,filter 1.2s}
.msg{max-width:82%;padding:8px 13px;border-radius:18px;word-break:break-word;animation:pop .25s ease-out}
.msg.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:5px}
.msg.them .who{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.draft{align-self:flex-end;background:transparent;color:var(--ink);border:1px dashed var(--muted);border-bottom-right-radius:5px;min-height:2.4em}
.msg.draft::after{content:"";display:inline-block;width:1px;height:1em;background:var(--ink);margin-left:1px;vertical-align:-2px;animation:blink 1s infinite}
.typing{align-self:flex-start;background:var(--them);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.stamp{align-self:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-top:6px}
.narr{margin:4px 0}
.think{margin:2px 0;font-family:var(--serif);font-size:16px;border-left:2px solid var(--line);padding-left:12px}
.pick{align-self:flex-end;font-size:12px;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:2px 10px;max-width:90%}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:1px;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.3);animation:drop .35s ease-out}
.notice .src{font-size:11px;color:var(--muted);letter-spacing:.04em}
.weight{display:flex;align-items:center;gap:6px}
.weight b{display:inline-flex;gap:3px}
.weight b i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}
.weight b i.f{background:var(--muted)}
.verdict{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.5;text-align:center;margin:18px 0 6px;text-wrap:balance}
.chapter{padding-block:24px 8px;display:grid;gap:6px}
.chapter .n{font-size:12px;color:var(--muted);letter-spacing:.08em}
.chapter h2{font-family:var(--serif);font-size:26px;margin:0}
.chapter p{margin:0;color:var(--muted)}
.chapter .care{color:var(--ink);background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}

.pin{border-top:1px solid var(--line);padding-block:10px 4px}
.carry{border-top:1px dashed var(--line);padding-block:8px 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.carry:not([hidden]) + .pin{border-top:0}
.thread{border-color:var(--accent)}
.times{display:grid;gap:12px}
.time{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.time .when{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.pin small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.pin p{margin:0;font-family:var(--serif);font-weight:700;font-size:18px}
.dock{padding-block:10px 16px;min-height:64px;max-height:52vh;overflow-y:auto}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;line-height:1.5;transition:border-color .15s}
.choice:hover{border-color:var(--accent)}
.choice.quiet{border-style:dashed;color:var(--muted)}
.choice.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);text-align:center;font-weight:500}
.q{margin:0 0 8px;font-size:14px}
.dots{display:flex;justify-content:space-between;gap:4px}
.dot{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%}
.dot::before{content:"";width:var(--s);height:var(--s);border-radius:50%;background:var(--soft);border:1.5px solid var(--accent);transition:background .15s}
.dot:hover::before{background:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-inline:8px}
.own{display:grid;gap:8px;margin-top:10px}
.own textarea{width:100%;min-height:64px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.own button{justify-self:end;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 16px}

/* Mirror */
.result .wrap{padding-block:32px 48px;display:grid;gap:24px}
.result h1{font-family:var(--serif);font-size:28px;margin:0;line-height:1.35;text-wrap:balance}
.result p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3{margin:0;font-size:16px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--accent);color:var(--accent)}
.chip.dash{border-style:dashed}
.chip.mute{border-color:var(--line);color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.path{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:14px}
.quote{font-family:var(--serif);font-size:16px;border-left:2px solid var(--accent);padding-left:10px}
.quote small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.reveal{font-size:14px;color:var(--muted)}
svg.curve{width:100%;height:auto;display:block}
.cards{display:grid;gap:12px}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:500}
details ul{margin:10px 0 0;padding-left:1.2em;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.close{font-family:var(--serif);font-size:19px;line-height:1.7;text-align:center;padding-block:8px}
.fine{font-size:12px;color:var(--muted)}

/* Crayon art: the artist's drawings, cut out as ink on transparency.
   The circle marks what closes, the tangle marks what keeps looping, the two figures are the people inside it. */
:root{--art:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--art:invert(.88)}}
:root[data-theme="dark"]{--art:invert(.88)}
.art{display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:var(--art)}
@property --sweep{syntax:'<angle>';inherits:false;initial-value:360deg}
.drawn{-webkit-mask:conic-gradient(from -100deg,#000 var(--sweep),transparent 0);mask:conic-gradient(from -100deg,#000 var(--sweep),transparent 0);animation:draw 1.6s cubic-bezier(.5,0,.3,1) .2s both}
@keyframes draw{from{--sweep:0deg}to{--sweep:360deg}}

/* prologue: the two figures still turning at the edges of the page, the title circled by hand */
.intro{position:relative;overflow-x:hidden}
.intro .wrap{position:relative;z-index:1}
.intro .fig{position:absolute;z-index:0;width:clamp(130px,26vw,240px);opacity:.2}
.intro .fig-a{left:max(-16px,calc(50% - 440px));bottom:3%;rotate:-10deg;animation:drift-a 16s ease-in-out infinite alternate}
.intro .fig-b{right:max(-16px,calc(50% - 440px));top:3%;rotate:12deg;animation:drift-b 18s ease-in-out infinite alternate}
@keyframes drift-a{to{rotate:4deg;translate:14px -18px}}
@keyframes drift-b{to{rotate:-2deg;translate:-14px 18px}}
.intro:not(.go) .drawn,.intro:not(.go) .fig{animation-play-state:paused}
.title-mark{position:relative;align-self:flex-start;padding-inline:.1em}
.title-mark .circ{position:absolute;left:-10%;top:-58%;width:120%;height:216%;opacity:.38;object-fit:fill}
.title-mark h1{position:relative}

/* chapters: the scene number sits inside a crayon circle */
.ring{position:relative;width:60px;height:60px;display:grid;place-items:center;font-family:var(--serif);font-size:24px;font-weight:700;margin-bottom:2px}
.ring img{position:absolute;inset:0;width:100%;height:100%;opacity:.75}

/* looping: a tangle grows behind the conversation each round and clears when the problem closes */
.app{position:relative}
.app > :not(.tangle-bg){position:relative;z-index:1}
.tangle-bg{position:absolute;z-index:0;left:50%;top:44%;width:min(80%,360px);translate:-50% -50%;
  opacity:calc(var(--fade) * .5);scale:calc(.5 + var(--fade) * .9);rotate:calc(var(--fade) * 50deg);
  transition:opacity 1.4s,scale 1.8s,rotate 1.8s}
.pin small{display:flex;align-items:center;gap:6px}
.pin-mark{width:16px;height:16px;opacity:.7}

/* endings: closed problems are circled, open ones leave a tangle behind the words */
.verdict{position:relative;isolation:isolate;padding-block:14px}
.verdict .mark{position:absolute;z-index:-1;left:50%;top:50%;translate:-50% -50%}
.verdict .m-circle{width:min(108%,340px);height:190%;object-fit:fill;opacity:.38}
.verdict .m-tangle{width:120px;height:120px;opacity:.16}
.verdict .m-small{width:58px;height:58px;left:auto;right:2%;top:12%;translate:none;opacity:.35}

/* mirror: each ending carries its mark; the close returns to the two figures inside the circle */
.chip{display:inline-flex;align-items:center;gap:6px}
.chip img{width:14px;height:14px}
.finale{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%;justify-self:center;margin-top:8px}
.finale img{position:absolute}
.finale .f-circle{inset:0;width:100%;height:100%;opacity:.7}
.finale .f-a{width:42%;left:12%;top:24%;rotate:-18deg;animation:drift-a 14s ease-in-out infinite alternate}
.finale .f-b{width:42%;right:10%;top:16%;rotate:16deg;animation:drift-b 15s ease-in-out infinite alternate}

/* Opening film: the video is drawn on white paper, so its frame stays white in both themes */
.film{position:fixed;inset:0;z-index:10;background:#FFFFFF;display:grid;place-items:center;transition:opacity .8s}
.film.out{opacity:0}
.film video{width:auto;height:100dvh;max-width: 100dvw;max-height: 100dvh;object-fit:contain;display:block}
.film-btn{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:rgba(255,255,255,.85);color:#1A1A1A;border:1px solid #1A1A1A;border-radius:999px;padding:6px 16px;font-size:13px}
.film-play{position:absolute;inset:auto;background:#1A1A1A;color:#FFFFFF;border:0;border-radius:999px;padding:12px 28px;font-weight:500}
.film-start{padding:14px 40px;font-size:16px;letter-spacing:.1em;box-shadow:0 0 0 2px #FFFFFF,0 8px 24px -8px rgba(0,0,0,.5);animation:pop .5s ease-out}
.film-btn:focus-visible,.film-play:focus-visible{outline:2px solid #1A1A1A;outline-offset:2px}
@media (max-aspect-ratio: 9/16){.film video{object-fit:cover}}

@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="film" id="film">
  <video id="filmVideo" src="intro.mp4" poster="poster.jpg" muted playsinline preload="auto" aria-label="開場影片：兩個人被捲進一個漩渦"></video>
  <button class="film-play" id="filmPlay" type="button" hidden>播放</button>
  <button class="film-play film-start" id="filmStart" type="button" hidden>開始</button>
  <button class="film-btn" id="filmSkip" type="button">略過</button>
</div>

<section class="screen intro" id="intro">
  <img class="art fig fig-a" src="art/figure-a.webp" alt="" aria-hidden="true">
  <img class="art fig fig-b" src="art/figure-b.webp" alt="" aria-hidden="true">
  <div class="wrap">
    <p class="small">一件關於面對問題的互動作品</p>
    <div class="title-mark"><img class="art circ drawn" src="art/circle.webp" alt="" aria-hidden="true"><h1>社會情緒訓練</h1></div>
    <p class="lede">有些問題可以分析、解決，然後就過去了。有些問題沒有答案，我們反覆去想，久了會習慣，可是它一直都在。</p>
    <p>這是一個大四學生的一個學期，從九月走到隔年二月。有些事處理完就過去了；有一個問題會反覆回來，每次回來，身邊的情況和你考慮的事都不太一樣。你不會事先知道哪些問題有解，只能邊走邊判斷。</p>
    <p class="small">約 15 分鐘，六章加一段尾聲。故事裡有一條線和家人生病有關，可以從一開始就略過，走到那裡時也可以略過。最後只會呈現你走過的路，不會替你下結論。</p>
    <div class="starts"><button class="btn" id="startBtn" type="button">下一頁</button><button class="btn-quiet" id="startSkipBtn" type="button">下一頁，略過家人生病的情節</button></div>
  </div>
</section>

<section class="screen" id="appScreen" hidden>
  <div class="app">
    <img class="art tangle-bg" src="art/tangle.webp" alt="" aria-hidden="true">
    <div class="top">
      <div><div class="work">社會情緒訓練</div><div class="name" id="sceneName"></div></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="carry" id="carry" hidden></div>
    <div class="pin" id="pin" hidden><small><img class="art pin-mark" src="art/tangle.webp" alt="" aria-hidden="true">還沒有答案的問題</small><p id="pinText"></p></div>
    <div class="dock" id="dock"></div>
  </div>
</section>

<section class="screen result" id="resultScreen" hidden>
  <div class="wrap" id="resultWrap"></div>
</section>

<script>
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? 120 : ms));
const log = $('#log'), dock = $('#dock'), pin = $('#pin'), pinText = $('#pinText');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let cur = null; const results = [];
/* decorative crayon drawing from art/ (circle, tangle, figure-a, figure-b) */
function artImg(name, cls){ const i=el('img','art'+(cls?' '+cls:'')); i.src='art/'+name+'.webp'; i.alt=''; i.setAttribute('aria-hidden','true'); return i; }

/* ---------- rendering ---------- */
function render(m){
  let e;
  switch(m.k){
    case 'them': e=el('div','msg them'); if(m.who) e.append(el('span','who',esc(m.who))); e.append(el('span','',esc(m.t))); break;
    case 'me': e=el('div','msg me',esc(m.t)); break;
    case 'sys': e=el('div','sys',esc(m.t)); break;
    case 'stamp': e=el('div','stamp',esc(m.t)); break;
    case 'narr': e=el('p','narr',esc(m.t)); break;
    case 'think': e=el('p','think',esc(m.t)); break;
    case 'pick': e=el('div','pick','→ '+esc(m.t)); break;
    case 'verdict': {
      e=el('p','verdict',esc(m.t));
      const marks={circle:[['circle','m-circle drawn']], tangle:[['tangle','m-tangle']], mixed:[['circle','m-circle drawn'],['tangle','m-small']]}[m.mark]||[];
      marks.forEach(([src,cls])=>e.prepend(artImg(src,'mark '+cls)));
      break; }
    case 'notice': e=el('div','notice'); e.append(el('span','src',esc(m.app))); e.append(el('strong','',esc(m.title))); e.append(el('span','',esc(m.t))); break;
    case 'chapter': e=el('div','chapter');
      if(m.num){ const r=el('div','ring'); r.append(artImg('circle','drawn'), el('span','',m.num)); e.append(r); }
      e.append(el('span','n',esc(m.n))); e.append(el('h2','',esc(m.title))); e.append(el('p','',esc(m.t))); if(m.care) e.append(el('p','care',esc(m.care))); break;
    case 'weight': {
      e=el('div','sys weight'); e.append(el('span','','心裡的重量'));
      const b=el('b'); for(let i=1;i<=5;i++) b.append(el('i', i<=m.v?'f':'')); e.append(b); break; }
  }
  log.append(e); log.scrollTop = log.scrollHeight;
}
async function draft(text){
  const d=el('div','msg draft'); log.append(d); log.scrollTop=log.scrollHeight;
  const chars=[...text];
  for(let i=1;i<=chars.length;i++){ d.textContent=chars.slice(0,i).join(''); await sleep(70); }
  await sleep(900);
  for(let i=chars.length-1;i>=0;i--){ d.textContent=chars.slice(0,i).join(''); await sleep(25); }
  await sleep(300); d.remove();
  render({k:'sys', t:'（你把它刪掉了）'});
}
const GAP = {them:500, me:450, sys:500, stamp:700, narr:900, think:1000, notice:700, verdict:1100, pick:0, chapter:0};
async function play(list){
  for(const m of list){
    await sleep(m.d ?? GAP[m.k] ?? 600);
    if(m.k==='draft'){ await draft(m.t); continue; }
    if(m.k==='them' && !RM){
      const t=el('div','typing','<span></span><span></span><span></span>');
      log.append(t); log.scrollTop=log.scrollHeight; await sleep(m.type ?? 800); t.remove();
    }
    render(m);
  }
}
function choose(opts){
  return new Promise(res=>{
    dock.replaceChildren();
    const box=el('div','choices');
    opts.forEach(o=>{
      const b=el('button','choice'+(o.cls?' '+o.cls:''),esc(o.t)); b.type='button';
      b.onclick=()=>{
        dock.replaceChildren();
        if(o.cls!=='go'){ cur.path.push(o.t); render({k:'pick', t:o.t}); }
        res(o.v);
      };
      box.append(b);
    });
    dock.append(box);
  });
}
function rate(q){
  return new Promise(res=>{
    dock.replaceChildren();
    const w=el('div'); w.append(el('p','q',esc(q || '現在，這件事在你心裡有多重？')));
    const row=el('div','dots');
    for(let i=1;i<=5;i++){
      const b=el('button','dot'); b.type='button'; b.style.setProperty('--s',(10+i*6)+'px');
      b.setAttribute('aria-label','重量 '+i+'（共 5）');
      b.onclick=()=>{ cur.ratings.push(i); dock.replaceChildren(); render({k:'weight', v:i}); res(i); };
      row.append(b);
    }
    w.append(row); w.append(el('div','ends','<span>很輕</span><span>很重</span>'));
    dock.append(w);
  });
}
let reasonSeq=0;
function askReason(q, opts){
  return new Promise(res=>{
    dock.replaceChildren();
    const w=el('div'); w.append(el('p','q',esc(q)));
    const done = t => { dock.replaceChildren(); cur.reason=t; render({k:'pick', t}); res(t); };
    const box=el('div','choices');
    (opts || ['想累了','再怎麼想也不會有答案','生活還要繼續','其實我還沒停下來']).forEach(t=>{
      const b=el('button','choice',esc(t)); b.type='button'; b.onclick=()=>done(t); box.append(b);
    });
    w.append(box);
    const own=el('div','own'); const id='reason-'+(++reasonSeq);
    const lab=el('label','q','或用自己的話寫下來'); lab.htmlFor=id; lab.style.margin='0';
    const ta=el('textarea'); ta.id=id; ta.maxLength=120;
    const sb=el('button','','留下這句話'); sb.type='button';
    sb.onclick=()=>{ const t=ta.value.trim(); if(t) done(t); else ta.focus(); };
    own.append(lab,ta,sb); w.append(own);
    dock.append(w);
  });
}
const setFade = r => document.documentElement.style.setProperty('--fade', Math.min(.55, r*.15));
const setPin = t => { pinText.textContent=t; pin.hidden=false; if(typeof renderCarry==='function') renderCarry(); };
const clearPin = () => { pin.hidden=true; if(typeof renderCarry==='function') renderCarry(); };

/* ---------- shared pieces ---------- */
async function endSolved(v){
  cur.ending='B'; setFade(0); clearPin();
  await play([{k:'verdict', t:v || '這個問題，過去了。', mark:'circle'}]);
  await rate('問題結束了。現在它在你心裡有多重？');
}
async function endTime(reasonQ, opts, ending, verdict){
  cur.ending=ending || 'T';
  await askReason(reasonQ, opts);
  await play([{k:'verdict', t:verdict || '問題沒有消失，生活也照樣往前。', mark: cur.ending==='M' ? 'mixed' : 'tangle'}]);
  await rate('現在，這件事在你心裡有多重？');
}
/* rounds of looping; time keeps moving. returns 'resolved' or 'time' */
async function loop(c){
  setPin(c.pin);
  for(let r=1;r<=c.rounds;r++){
    cur.loops=r; setFade(r);
    await play([{k:'stamp', t:c.stamp[r-1]}, ...c.trig(r), {k:'think', t:c.thought[r-1]}]);
    await rate();
    const v = await choose(c.opts(r));
    const out = await c.onPick(v, r);
    if(out==='resolved') return 'resolved';
  }
  return 'time';
}

/* ---------- flow ---------- */
const CHAPTERS = [
  {month:'九月',  title:'額滿的必修',   sub:'大四上學期的第一天。不修就要延畢的課，已經額滿了。', fn:sCourse},
  {month:'十月',  title:'已讀的道歉',   sub:'你忘了小安生日聚餐的訂位，還怪到他頭上。', fn:sRead},
  {month:'十一月',title:'同一天',       sub:'最終面試在台北，和媽媽回診排在同一天。', fn:sMom2, mom:2,
    care:'這一章和下一次「去，還是留下？」都和家人生病有關。如果現在不適合，可以略過這條線。'},
  {month:'十二月',title:'分組報告',     sub:'統計學的期末報告週五要上台，有兩個組員一直不回。', fn:sGroup},
  {month:'十二月',title:'打不開的檔案', sub:'上台前一小時，簡報檔壞了。', fn:sFile},
  {month:'一月',  title:'週五五點前',   sub:'錄取通知來了，要在週五下午五點前回覆。', fn:sMom3, mom:3},
  {month:'二月',  title:'尾聲',         sub:'寒假的最後一週。', fn:sEnd}
];

function show(id){ ['intro','appScreen','resultScreen'].forEach(s=>$('#'+s).hidden = s!==id); }
async function runAll(skipMom){
  results.length=0; carried.length=0; renderCarry(); story.skipMom=!!skipMom; delete story.anReplied; delete story.decision;
  show('appScreen');
  const N=CHAPTERS.length;
  const steps=$('#steps'); steps.replaceChildren(); for(let i=0;i<N;i++) steps.append(el('i'));
  let skipNoted=false;
  for(let i=0;i<N;i++){
    const sc=CHAPTERS[i];
    cur={title:sc.title, month:sc.month, mom:sc.mom, ratings:[], path:[], loops:0, ending:null, reason:null, reveal:null};
    steps.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on', j<=i));
    if(sc.mom && story.skipMom){ if(!skipNoted){ cur.ending='S'; results.push(cur); skipNoted=true; } continue; }
    log.replaceChildren(); setFade(0); clearPin();
    $('#sceneName').textContent=`${sc.month}・${sc.title}`;
    render({k:'chapter', num: sc.fn===sEnd ? '' : String(i+1), n: sc.fn===sEnd ? '尾聲' : `${sc.month}・第 ${i+1} 章，共 ${N-1} 章`, title:sc.title, t:sc.sub, care:sc.care});
    if(sc.mom) render({k:'sys', t:`「${PIN_MOM}」第 ${sc.mom} 次出現`});
    const go = await choose(sc.care ? [{t:'開始', v:1, cls:'go'},{t:'略過這條線', v:0, cls:'go'}] : [{t:'開始', v:1, cls:'go'}]);
    if(go){ await sc.fn(); } else { cur.ending='S'; story.skipMom=true; skipNoted=true; drop(PIN_MOM); }
    results.push(cur);
    if(go) await choose([{t: i<N-1 ? '下一章' : '看看你走過的路', v:1, cls:'go'}]);
  }
  showResults();
}

function curve(r, breaks){
  const W=300,H=96,pl=30,pr=12,pt=10,pb=14;
  const n=r.length, x=i=> n<2 ? pl+(W-pl-pr)/2 : pl+i*(W-pl-pr)/(n-1), y=v=> pt+(5-v)*(H-pt-pb)/4;
  let s=`<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="心裡的重量變化：${r.join('、')}">`;
  [1,3,5].forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`; });
  (breaks||[]).forEach(b=>{ const bx=(x(b-1)+x(b))/2; s+=`<line x1="${bx}" x2="${bx}" y1="${pt-4}" y2="${H-pb+4}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`; });
  s+=`<text x="0" y="${y(5)+4}" font-size="11" fill="var(--muted)">很重</text><text x="0" y="${y(1)+4}" font-size="11" fill="var(--muted)">很輕</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${r.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
  r.forEach((v,i)=>{ const last=i===n-1; s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`; });
  return s+'</svg>';
}
const ENDING = {B:['問題結束了',''], T:['時間往前了，問題還在','dash'], M:['一部分過去了，一部分還在','dash'], S:['略過','mute'], E:['日子繼續','mute']};

function momCard(){
  const ms=results.filter(r=>r.mom && r.ending!=='S');
  if(!ms.length) return null;
  const c=el('div','card thread');
  const h=el('div','card-head'); h.append(el('h3','',`反覆出現的問題：「${PIN_MOM}」`)); { const ch=el('span','chip dash',`出現 ${ms.length} 次`); ch.prepend(artImg('tangle')); h.append(ch); } c.append(h);
  c.append(el('p','meta','同一個問題，在九月、十一月、一月回來，一次比一次大。每一次，你身邊的情況、你考慮的事，和你放下它的理由都不一樣。'));
  const all=[], breaks=[];
  ms.forEach((m,i)=>{ if(i) breaks.push(all.length); all.push(...m.ratings); });
  c.insertAdjacentHTML('beforeend', curve(all, breaks));
  const list=el('div','times');
  ms.forEach(m=>{
    const t=el('div','time');
    t.append(el('span','when',`第 ${m.mom} 次・${m.month}`));
    t.append(el('p','meta',`心裡的重量：${m.ratings.join(' → ')}`));
    const cnt=new Map(); m.path.filter(p=>p!==m.reason).forEach(p=>cnt.set(p,(cnt.get(p)||0)+1));
    const considered=[...cnt].map(([p,k])=> k>1 ? `${p}（${k} 次）` : p);
    if(considered.length) t.append(el('p','',`你想過的：${esc(considered.join('、'))}`));
    if(m.reason) t.append(el('p','quote','「'+esc(m.reason)+'」'));
    list.append(t);
  });
  c.append(list);
  return c;
}

function showResults(){
  const w=$('#resultWrap'); w.replaceChildren();
  const head=el('div'); head.style.display='grid'; head.style.gap='10px';
  head.append(el('p','fine','社會情緒訓練'));
  head.append(el('h1','','這是你這一個學期走過的路。'));
  head.append(el('p','lead','這裡只呈現你在每一章停在哪裡、繞了幾圈，還有你自己說的理由。'));
  w.append(head);

  const mc=momCard(); if(mc) w.append(mc);

  const cards=el('div','cards');
  results.forEach(r=>{
    const c=el('div','card');
    const h=el('div','card-head'); h.append(el('h3','',`${esc(r.month)}・${esc(r.title)}`));
    const [label, cls] = ENDING[r.ending]; const chip=el('span','chip'+(cls?' '+cls:''),label);
    const mk={B:'circle', T:'tangle', M:'tangle'}[r.ending]; if(mk) chip.prepend(artImg(mk));
    h.append(chip);
    c.append(h);
    if(r.ending==='E'){ c.append(el('p','meta',`最後的重量：${r.ratings.join(' → ')}`)); cards.append(c); return; }
    if(r.ending==='S'){ c.append(el('p','meta', r.mom ? '你選擇略過「去，還是留下？」這條線。' : '你選擇略過這一章。')); cards.append(c); return; }
    const parts=[];
    if(r.mom) parts.push(`這個問題第 ${r.mom} 次出現`);
    if(r.loops) parts.push(`繞了 ${r.loops} 圈`);
    parts.push(`心裡的重量：${r.ratings.join(' → ')}`);
    c.append(el('p','meta',parts.join('　')));
    c.insertAdjacentHTML('beforeend', curve(r.ratings));
    const ol=el('ol','path'); r.path.forEach(t=>ol.append(el('li','',esc(t)))); c.append(ol);
    if(r.reason){ const q=el('p','quote'); q.append(el('small','','你停下來的理由')); q.append(document.createTextNode('「'+r.reason+'」')); c.append(q); }
    if(r.reveal) c.append(el('p','reveal','後來才知道：'+esc(r.reveal)));
    cards.append(c);
  });
  w.append(cards);

  const fin=el('div','finale'); fin.setAttribute('aria-hidden','true');
  fin.append(artImg('circle','f-circle drawn'), artImg('figure-a','f-a'), artImg('figure-b','f-b'));
  w.append(fin);
  w.append(el('p','close','有些問題過去了，有些問題你帶著走。<br>它還會回來，回來的時候，你也不是原來的你了。'));

  const det=el('details'); det.append(el('summary','','這件作品參考的研究'));
  const ul=el('ul');
  [
    'Martin 與 Tesser（1996）：反芻會在目標達成，或目標被放下時停止。',
    'Masicampo 與 Baumeister（2011）：替未完成的事訂下具體計畫，就能減少它帶來的干擾念頭。',
    'Watkins（2008）：抽象地追問「為什麼」的反芻，比具體地想「怎麼辦」更容易讓人困住。',
    'Lazarus 與 Folkman（1984）：人怎麼面對問題，取決於他如何判斷這件事能不能控制；同一件事，在不同時間點的判斷也會不同。'
  ].forEach(t=>ul.append(el('li','',esc(t))));
  det.append(ul); w.append(det);

  const again=el('button','btn','再走一次'); again.type='button'; again.onclick=()=>{ show('intro'); $('#intro').scrollTop=0; $('#intro').classList.add('go'); };
  w.append(again);
  w.append(el('p','fine','「已讀的道歉」裡對方會不會回是隨機的，它也會影響故事的結尾。這是一件互動作品，不是心理測驗或診斷。如果有某個問題已經困住你很久，找信任的人或諮商師聊聊會有幫助。'));
  show('resultScreen'); $('#resultScreen').scrollTop=0;
}

$('#startBtn').onclick = ()=>runAll(false);
$('#startSkipBtn').onclick = ()=>runAll(true);

/* opening film, then the original intro screen */
(function(){
  const film=$('#film'), v=$('#filmVideo'), playBtn=$('#filmPlay'), startFilm=$('#filmStart');
  let done=false;
  /* film over (ended, skipped or failed): hold on the last frame and offer a centred start button */
  const finish=()=>{
    if(done) return; done=true;
    v.pause();
    playBtn.hidden=true; $('#filmSkip').hidden=true;
    startFilm.hidden=false; startFilm.focus({preventScroll:true});
  };
  /* start: fade the film away to reveal the prologue screen, whose 下一頁 runs the original flow */
  startFilm.onclick=()=>{
    startFilm.hidden=true;
    film.classList.add('out');
    setTimeout(()=>{ film.hidden=true; }, RM ? 0 : 800);
    $('#intro').scrollTop=0; $('#intro').classList.add('go');
    $('#startBtn').focus({preventScroll:true});
  };
  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  $('#filmSkip').onclick=finish;
  playBtn.onclick=()=>{ playBtn.hidden=true; v.play().catch(finish); };
  const p=v.play();
  if(p && p.catch) p.catch(()=>{ playBtn.hidden=false; });
})();
