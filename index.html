<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>社會情緒訓練 黑白版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: a single phone-width chat column; the log fades with each loop while the unanswered question stays pinned at full strength above the choices. */
:root{
  --bg:#EDEDED; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B6B; --line:#D4D4D4;
  --them:#E0E0E0; --accent:#2B2B2B; --on-accent:#FFFFFF; --soft:#E6E6E6;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --fade:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1C1C1C; --ink:#E8E8E8; --muted:#8F8F8F; --line:#303030;
  --them:#262626; --accent:#D9D9D9; --on-accent:#111111; --soft:#242424; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1C1C1C; --ink:#E8E8E8; --muted:#8F8F8F; --line:#303030;
  --them:#262626; --accent:#D9D9D9; --on-accent:#111111; --soft:#242424; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
*{box-sizing:border-box}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.screen{height:100%;overflow-y:auto}
.screen,.log,.dock{scrollbar-width:none}
.screen::-webkit-scrollbar,.log::-webkit-scrollbar,.dock::-webkit-scrollbar{display:none}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px}

/* Intro */
.intro .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:40px}
.intro h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,40px);line-height:1.25;margin:0;text-wrap:balance}
.intro p{margin:0;max-width:34em}
.intro .lede{font-family:var(--serif);font-size:17px}
.intro .small{color:var(--muted);font-size:13px}
.starts{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.btn-quiet{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:11px 20px;font-size:14px}
.btn-quiet:hover{border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 28px;font-weight:500;align-self:flex-start}

/* App */
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-inline:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.top .name{font-weight:700;font-size:15px}
.top .work{color:var(--muted);font-size:12px;letter-spacing:.06em}
.steps{display:flex;gap:5px}
.steps i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:16px;
  opacity:calc(1 - var(--fade) * .65);filter:saturate(calc(1 - var(--fade)));transition:opacity 1.2s,filter 1.2s}
.msg{max-width:82%;padding:8px 13px;border-radius:18px;word-break:break-word;animation:pop .25s ease-out}
.msg.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:5px}
.msg.them .who{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.draft{align-self:flex-end;background:transparent;color:var(--ink);border:1px dashed var(--muted);border-bottom-right-radius:5px;min-height:2.4em}
.msg.draft::after{content:"";display:inline-block;width:1px;height:1em;background:var(--ink);margin-left:1px;vertical-align:-2px;animation:blink 1s infinite}
.typing{align-self:flex-start;background:var(--them);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.stamp{align-self:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-top:6px}
.narr{margin:4px 0}
.think{margin:2px 0;font-family:var(--serif);font-size:16px;border-left:2px solid var(--line);padding-left:12px}
.pick{align-self:flex-end;font-size:12px;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:2px 10px;max-width:90%}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:1px;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.3);animation:drop .35s ease-out}
.notice .src{font-size:11px;color:var(--muted);letter-spacing:.04em}
.weight{display:flex;align-items:center;gap:6px}
.weight b{display:inline-flex;gap:3px}
.weight b i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}
.weight b i.f{background:var(--muted)}
.verdict{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.5;text-align:center;margin:18px 0 6px;text-wrap:balance}
.chapter{padding-block:24px 8px;display:grid;gap:6px}
.chapter .n{font-size:12px;color:var(--muted);letter-spacing:.08em}
.chapter h2{font-family:var(--serif);font-size:26px;margin:0}
.chapter p{margin:0;color:var(--muted)}
.chapter .care{color:var(--ink);background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}

.pin{border-top:1px solid var(--line);padding-block:10px 4px}
.carry{border-top:1px dashed var(--line);padding-block:8px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.carry-k{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-right:2px}
.carry-tag{font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.carry:not([hidden]) + .pin{border-top:0}
.thread{border-color:var(--accent)}
.times{display:grid;gap:12px}
.time{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.time .when{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.pin small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.pin p{margin:0;font-family:var(--serif);font-weight:700;font-size:18px}
.dock{padding-block:10px 16px;min-height:64px;max-height:52vh;overflow-y:auto}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;line-height:1.5;transition:border-color .15s}
.choice:hover{border-color:var(--accent)}
.choice.quiet{border-style:dashed;color:var(--muted)}
.choice.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);text-align:center;font-weight:500}
.q{margin:0 0 8px;font-size:14px}
.dots{display:flex;justify-content:center;gap:10px}
.ends{max-width:280px;margin-inline:auto}
.dot{width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%}
.dot::before{content:"";width:var(--s);height:var(--s);border-radius:50%;background:var(--soft);border:1.5px solid var(--accent);transition:background .15s}
.dot:hover::before{background:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-inline:8px}
.own{display:grid;gap:8px;margin-top:10px}
.own textarea{width:100%;min-height:64px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.own button{justify-self:end;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 16px}

/* Mirror */
.result .wrap{padding-block:32px 48px;display:grid;gap:24px}
.result h1{font-family:var(--serif);font-size:28px;margin:0;line-height:1.35;text-wrap:balance}
.result p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3{margin:0;font-size:16px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--accent);color:var(--accent)}
.chip.dash{border-style:dashed}
.chip.mute{border-color:var(--line);color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.path{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:14px}
.quote{font-family:var(--serif);font-size:16px;border-left:2px solid var(--accent);padding-left:10px}
.quote small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.reveal{font-size:14px;color:var(--muted)}
svg.curve{width:100%;height:auto;display:block}
.cards{display:grid;gap:12px}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:500}
details ul{margin:10px 0 0;padding-left:1.2em;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.close{font-family:var(--serif);font-size:19px;line-height:1.7;text-align:center;padding-block:8px}
.fine{font-size:12px;color:var(--muted)}

/* Crayon art: the artist's drawings, cut out as ink on transparency.
   The circle marks what closes, the tangle marks what keeps looping, the two figures are the people inside it. */
:root{--art:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--art:invert(.88)}}
:root[data-theme="dark"]{--art:invert(.88)}
.art{display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:var(--art)}
@property --sweep{syntax:'<angle>';inherits:false;initial-value:360deg}
.drawn{-webkit-mask:conic-gradient(from -100deg,#000 var(--sweep),transparent 0);mask:conic-gradient(from -100deg,#000 var(--sweep),transparent 0);animation:draw 1.6s cubic-bezier(.5,0,.3,1) .2s both}
@keyframes draw{from{--sweep:0deg}to{--sweep:360deg}}

/* prologue: the two figures still turning at the edges of the page, the title circled by hand */
.intro{position:relative;overflow-x:hidden}
.intro .wrap{position:relative;z-index:1}
.intro .fig{position:absolute;z-index:0;width:clamp(130px,26vw,240px);opacity:.2}
.intro .fig-a{left:max(-16px,calc(50% - 440px));bottom:3%;rotate:-10deg;animation:drift-a 16s ease-in-out infinite alternate}
.intro .fig-b{right:max(-16px,calc(50% - 440px));top:3%;rotate:12deg;animation:drift-b 18s ease-in-out infinite alternate}
@keyframes drift-a{to{rotate:4deg;translate:14px -18px}}
@keyframes drift-b{to{rotate:-2deg;translate:-14px 18px}}
.intro:not(.go) .drawn,.intro:not(.go) .fig{animation-play-state:paused}
/* the hand-lettered title surfaces first; the prologue follows once it has settled */
.intro .logotype{margin:0 0 24px;width:min(100%,400px)}
.intro .logotype img{width:100%;display:block}
.intro .wrap > *{animation:rise .9s ease-out both}
.intro .wrap > .logotype{animation:surface 2.4s ease-out both}
.intro .wrap > :nth-child(1){animation-delay:2.2s}
.intro .wrap > :nth-child(3){animation-delay:2.4s}
.intro .wrap > :nth-child(4){animation-delay:2.8s}
.intro .wrap > :nth-child(5){animation-delay:3.2s}
.intro .wrap > :nth-child(6){animation-delay:3.6s}
.intro:not(.go) .wrap > *{animation-play-state:paused}
@keyframes surface{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* illustrations: the artist's drawings sit in the conversation like pages of a sketchbook */
.chapter .cover{width:min(100%,280px);justify-self:center;margin-bottom:10px;animation:pop .5s ease-out}
.pic{margin:10px 0;align-self:center;width:min(80%,300px);animation:pop .5s ease-out}
.pic img{width:100%}
.pic.motif{width:min(48%,170px)}
.verdict{padding-block:10px}

/* mirror: the close returns to the two figures inside the circle */
.finale{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%;justify-self:center;margin-top:8px}
.finale img{position:absolute}
.finale .f-circle{inset:0;width:100%;height:100%;opacity:.7}
.finale .f-a{width:42%;left:12%;top:24%;rotate:-18deg;animation:drift-a 14s ease-in-out infinite alternate}
.finale .f-b{width:42%;right:10%;top:16%;rotate:16deg;animation:drift-b 15s ease-in-out infinite alternate}

/* Opening film: the video is drawn on white paper, so its frame stays white in both themes */
.film{position:fixed;inset:0;z-index:10;background:#FFFFFF;display:grid;place-items:center;transition:opacity .8s}
.film.out{opacity:0}
.film video{width:auto;height:100dvh;max-width: 100dvw;max-height: 100dvh;object-fit:contain;display:block}
.film-btn{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:rgba(255,255,255,.85);color:#1A1A1A;border:1px solid #1A1A1A;border-radius:999px;padding:6px 16px;font-size:13px}
.film-play{position:absolute;inset:auto;background:#1A1A1A;color:#FFFFFF;border:0;border-radius:999px;padding:12px 28px;font-weight:500}
.film-start{padding:14px 40px;font-size:16px;letter-spacing:.1em;box-shadow:0 0 0 2px #FFFFFF,0 8px 24px -8px rgba(0,0,0,.5);animation:pop .5s ease-out}
.film-btn:focus-visible,.film-play:focus-visible{outline:2px solid #1A1A1A;outline-offset:2px}
@media (max-aspect-ratio: 9/16){.film video{object-fit:cover}}

/* other paths, shown at each chapter's end */
.others{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;margin-top:8px;animation:pop .35s ease-out}
.others .h{font-size:12px;color:var(--muted);letter-spacing:.06em}
.others ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px}
.others .note{margin:0;font-size:12px;color:var(--muted)}

/* results: four places */
.zones{gap:0}
.zones > .meta{margin-bottom:6px}
.zone{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.zone.empty{opacity:.5}
.zone-body{display:grid;gap:4px;min-width:0}
.zone-body p{margin:0}
.zone{align-items:center}
.face-box{width:68px;height:68px;display:grid;place-items:center}
.face-box img{width:var(--w);height:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:13px;background:var(--soft);border-radius:999px;padding:2px 10px}
.none{font-size:12px;color:var(--muted)}

/* results: weights side by side */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px 12px}
.mini{display:grid;gap:3px;min-width:0}
.mini-t{font-size:12px;font-weight:500}
.mini-v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
svg.mini-c{width:100%;height:auto;display:block}
.observes{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.observe{font-family:var(--serif);font-size:16px;line-height:1.7}

/* results: this time's shape */
.pattern{gap:14px}
.pat-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);align-items:center;gap:12px}
.pat-left{display:grid;gap:18px;min-width:0}
.pat-title{display:grid;gap:2px;min-width:0}
.pat-k{font-size:13px;color:var(--muted)}
.pat-name{font-family:var(--serif);font-size:clamp(24px,7vw,32px);line-height:1.3}
.pat-face{width:100%;max-height:260px;object-fit:contain}
.pat-ev{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px}
.pat-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pat-two > div{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.pat-two p{margin:0;font-size:14px}
.pat-h{font-size:12px;color:var(--muted);letter-spacing:.04em}
.pat-also{font-size:14px;color:var(--muted)}
.pat-q{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.pat-q span{font-size:12px;opacity:.75;letter-spacing:.04em}
.pat-q p{margin:0;font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.5}
.peers .peers-line{font-family:var(--serif);font-size:16px;line-height:1.7}
.peer-bars{display:grid;gap:6px}
.peer-row{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.peer-row.me{color:var(--ink);font-weight:700}
.pr-bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.pr-bar i{display:block;height:100%;background:var(--muted)}
.peer-row.me .pr-bar i{background:var(--accent)}
.pr-n{font-variant-numeric:tabular-nums}

/* results: an easy-going player */
.easy p{margin:0}
.mini-scale{font-size:11px;color:var(--muted)}
.more{display:grid;gap:14px}

.said{display:grid;gap:12px}
.share textarea{width:100%;min-height:120px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.share-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.copy{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:7px 18px}
details.each > .cards{margin-top:12px}

@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="film" id="film">
  <video id="filmVideo" src="intro.mp4" poster="poster.jpg" muted playsinline preload="auto" aria-label="開場影片：兩個人被捲進一個漩渦"></video>
  <button class="film-btn" id="filmSkip" type="button">略過</button>
</div>

<section class="screen intro" id="intro">
  <img class="art fig fig-a" src="art/figure-a.webp" alt="" aria-hidden="true">
  <img class="art fig fig-b" src="art/figure-b.webp" alt="" aria-hidden="true">
  <div class="wrap">
    <p class="small">一件關於面對問題的互動作品</p>
    <h1 class="logotype"><img class="art" src="art/logotype.webp" alt="社會情緒訓練 Social and Emotional Training"></h1>
    <p class="lede">有些問題可以分析、解決，然後就過去了。有些問題沒有答案，我們反覆去想，久了會習慣，可是它一直都在。</p>
    <p>這是一個大四學生的一個學期，從九月走到隔年二月。有些事處理完就過去了；有一個問題會反覆回來，每次回來，身邊的情況和你考慮的事都不太一樣。你不會事先知道哪些問題有解，只能邊走邊判斷。</p>
    <p class="small">約 8 分鐘，五章加一段尾聲。故事裡有一條線和家人生病有關，可以從一開始就略過，走到那裡時也可以略過。最後只會呈現你走過的路，不會替你下結論。</p>
    <div class="starts"><button class="btn" id="startBtn" type="button">下一頁</button><button class="btn-quiet" id="startSkipBtn" type="button">下一頁，略過家人生病的情節</button></div>
  </div>
</section>

<section class="screen" id="appScreen" hidden>
  <div class="app">
    <div class="top">
      <div><div class="work">社會情緒訓練</div><div class="name" id="sceneName"></div></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="carry" id="carry" hidden></div>
    <div class="pin" id="pin" hidden><small>還沒有答案的問題</small><p id="pinText"></p></div>
    <div class="dock" id="dock"></div>
  </div>
</section>

<section class="screen result" id="resultScreen" hidden>
  <div class="wrap" id="resultWrap"></div>
</section>

<script>
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = .75; /* lower = faster */
const sleep = ms => new Promise(r => setTimeout(r, RM ? 120 : ms*SPEED));
const log = $('#log'), dock = $('#dock'), pin = $('#pin'), pinText = $('#pinText');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let cur = null; const results = [];
/* decorative crayon drawing from art/ (circle, tangle, figure-a, figure-b) */
function artImg(name, cls){ const i=el('img','art'+(cls?' '+cls:'')); i.src='art/'+name+'.webp'; i.alt=''; i.setAttribute('aria-hidden','true'); return i; }

/* ---------- rendering ---------- */
function render(m){
  let e;
  switch(m.k){
    case 'them': e=el('div','msg them'); if(m.who) e.append(el('span','who',esc(m.who))); e.append(el('span','',esc(m.t))); break;
    case 'me': e=el('div','msg me',esc(m.t)); break;
    case 'sys': e=el('div','sys',esc(m.t)); break;
    case 'stamp': e=el('div','stamp',esc(m.t)); break;
    case 'narr': e=el('p','narr',esc(m.t)); break;
    case 'think': e=el('p','think',esc(m.t)); break;
    case 'pick': e=el('div','pick','→ '+esc(m.t)); break;
    case 'verdict': e=el('p','verdict',esc(m.t)); break;
    case 'pic': e=el('figure','pic'+(m.cls?' '+m.cls:'')); e.append(artImg(m.src)); break;
    case 'notice': e=el('div','notice'); e.append(el('span','src',esc(m.app))); e.append(el('strong','',esc(m.title))); e.append(el('span','',esc(m.t))); break;
    case 'chapter': e=el('div','chapter');
      if(m.pic) e.append(artImg(m.pic,'cover'));
      e.append(el('span','n',esc(m.n))); e.append(el('h2','',esc(m.title))); e.append(el('p','',esc(m.t))); if(m.care) e.append(el('p','care',esc(m.care))); break;
    case 'weight': {
      e=el('div','sys weight'); e.append(el('span','','心裡的重量'));
      const b=el('b'); for(let i=1;i<=5;i++) b.append(el('i', i<=m.v?'f':'')); e.append(b); break; }
  }
  log.append(e); log.scrollTop = log.scrollHeight;
}
async function draft(text){
  const d=el('div','msg draft'); log.append(d); log.scrollTop=log.scrollHeight;
  const chars=[...text];
  for(let i=1;i<=chars.length;i++){ d.textContent=chars.slice(0,i).join(''); await sleep(70); }
  await sleep(900);
  for(let i=chars.length-1;i>=0;i--){ d.textContent=chars.slice(0,i).join(''); await sleep(25); }
  await sleep(300); d.remove();
  render({k:'sys', t:'（你把它刪掉了）'});
}
const GAP = {pic:700, them:500, me:450, sys:500, stamp:700, narr:900, think:1000, notice:700, verdict:1100, pick:0, chapter:0};
async function play(list){
  for(const m of list){
    await sleep(m.d ?? GAP[m.k] ?? 600);
    if(m.k==='draft'){ await draft(m.t); continue; }
    if(m.k==='them' && !RM){
      const t=el('div','typing','<span></span><span></span><span></span>');
      log.append(t); log.scrollTop=log.scrollHeight; await sleep(m.type ?? 800); t.remove();
    }
    render(m);
  }
}
function choose(opts){
  return new Promise(res=>{
    dock.replaceChildren();
    const box=el('div','choices');
    opts.forEach(o=>{
      const b=el('button','choice'+(o.cls?' '+o.cls:''),esc(o.t)); b.type='button';
      b.onclick=()=>{
        dock.replaceChildren();
        if(o.cls!=='go'){ cur.path.push(o.t); render({k:'pick', t:o.t}); }
        res(o.v);
      };
      box.append(b);
    });
    dock.append(box);
  });
}
async function rate(q){
  const v = await rateOnly(q);
  if(cur.cope==null && !cur.noCope) await cope();
  return v;
}
/* the second half of the appraisal: can I handle this? asked once per chapter */
function cope(){
  return new Promise(res=>{
    dock.replaceChildren();
    const w=el('div'); w.append(el('p','q','你覺得這件事，你處理得來嗎？'));
    const box=el('div','choices');
    Object.entries(COPE).forEach(([v,t])=>{
      const b=el('button','choice',esc(t)); b.type='button';
      b.onclick=()=>{ dock.replaceChildren(); cur.cope=+v; render({k:'pick', t}); res(+v); };
      box.append(b);
    });
    w.append(box); dock.append(w);
  });
}
const COPE = {1:'處理得來', 2:'有點麻煩，有點壓力', 3:'處理不來'};
function rateOnly(q){
  return new Promise(res=>{
    dock.replaceChildren();
    const w=el('div'); w.append(el('p','q',esc(q || '現在，這件事在你心裡有多重？')));
    const row=el('div','dots');
    for(let i=1;i<=5;i++){
      const b=el('button','dot'); b.type='button'; b.style.setProperty('--s',(10+i*6)+'px');
      b.setAttribute('aria-label','重量 '+i+'（共 5）');
      b.onclick=()=>{ cur.ratings.push(i); dock.replaceChildren(); render({k:'weight', v:i}); res(i); };
      row.append(b);
    }
    w.append(row); w.append(el('div','ends','<span>很輕</span><span>很重</span>'));
    dock.append(w);
  });
}
let reasonSeq=0;
function askReason(q, opts){
  return new Promise(res=>{
    dock.replaceChildren();
    const w=el('div'); w.append(el('p','q',esc(q)));
    const done = t => { dock.replaceChildren(); cur.reason=t; render({k:'pick', t}); res(t); };
    const box=el('div','choices');
    (opts || ['想累了','再怎麼想也不會有答案','生活還要繼續','其實我還沒停下來']).forEach(t=>{
      const b=el('button','choice',esc(t)); b.type='button'; b.onclick=()=>done(t); box.append(b);
    });
    w.append(box);
    const own=el('div','own'); const id='reason-'+(++reasonSeq);
    const lab=el('label','q','或用自己的話寫下來'); lab.htmlFor=id; lab.style.margin='0';
    const ta=el('textarea'); ta.id=id; ta.maxLength=120;
    const sb=el('button','','留下這句話'); sb.type='button';
    sb.onclick=()=>{ const t=ta.value.trim(); if(t) done(t); else ta.focus(); };
    own.append(lab,ta,sb); w.append(own);
    dock.append(w);
  });
}
const setFade = r => document.documentElement.style.setProperty('--fade', Math.min(.55, r*.15));
const setPin = t => { pinText.textContent=t; pin.hidden=false; if(typeof renderCarry==='function') renderCarry(); };
const clearPin = () => { pin.hidden=true; if(typeof renderCarry==='function') renderCarry(); };

/* ---------- other paths ---------- */
async function showOthers(list){
  await sleep(900);
  const e=el('div','others');
  const hd=el('span','h'); hd.textContent='其他人也可能這樣做'; e.append(hd);
  const ul=el('ul'); list.forEach(t=>ul.append(el('li','',esc(t)))); e.append(ul);
  e.append(el('p','note','沒有哪一條比較好，只是還有這些路。'));
  log.append(e); log.scrollTop=log.scrollHeight;
}

/* ---------- shared pieces ---------- */
async function endSolved(v){
  cur.ending='B'; setFade(0); clearPin();
  await play([{k:'verdict', t:v || '這個問題，過去了。', mark:'circle'}]);
  await rate('問題結束了。現在它在你心裡有多重？');
}
async function endTime(reasonQ, opts, ending, verdict){
  cur.ending=ending || 'T';
  await askReason(reasonQ, opts);
  await play([{k:'verdict', t:verdict || '問題沒有消失，生活也照樣往前。', mark: cur.ending==='M' ? 'mixed' : 'tangle'}]);
  await rate('現在，這件事在你心裡有多重？');
}
/* rounds of looping; time keeps moving. returns 'resolved' or 'time' */
async function loop(c){
  setPin(c.pin);
  for(let r=1;r<=c.rounds;r++){
    cur.loops=r; setFade(r);
    await play([{k:'stamp', t:c.stamp[r-1]}, ...c.trig(r), {k:'think', t:c.thought[r-1]}]);
    await rate();
    const v = await choose(c.opts(r));
    const out = await c.onPick(v, r);
    if(out==='resolved') return 'resolved';
  }
  return 'time';
}

/* ---------- story state ---------- */
const PIN_MOM = '去，還是留下？';
const PIN_AN = '他為什麼不回？';
const story = {skipMom:false};
const carried = [];
const carryEl = document.getElementById('carry');
function renderCarry(){
  const items = carried.filter(t => pin.hidden || t !== pinText.textContent);
  carryEl.hidden = !items.length;
  carryEl.replaceChildren(el('span','carry-k','還帶在身上'), ...items.map(t=>el('span','carry-tag',esc(t))));
}
function carry(t){ if(!carried.includes(t)) carried.push(t); renderCarry(); }
function drop(t){ const i=carried.indexOf(t); if(i>=0) carried.splice(i,1); renderCarry(); }

/* ---------- 1. 九月：the full course (looks hopeless, is solvable) ---------- */
async function sCourse(){
  await play([
    {k:'stamp', t:'加退選第一天 早上 9:00'},
    {k:'narr', t:'大四上學期。有一門大四才開的必修，這學期不修，就得延畢。你打開選課系統：'},
    {k:'sys', t:'必修　額滿　60／60'},
    {k:'think', t:'這下完了。'}
  ]);
  await rate();
  let opts=[
    {t:'一直刷新頁面，等有人退選', v:'refresh'},
    {t:'寄信給授課老師，問能不能加簽', v:'mail'},
    {t:'到系辦問問看', v:'office'},
    {t:'開始想延畢要怎麼跟家裡說', v:'rum'}
  ];
  let refreshes=0;
  while(true){
    const v=await choose(opts);
    if(v==='mail'){
      await play([
        {k:'notice', app:'Gmail', title:'Re：必修加簽申請', t:'王老師'},
        {k:'them', who:'王老師', t:'第一週來上課，下課找我簽加簽單就可以了。', type:1300},
        {k:'stamp', t:'週三 下午'},
        {k:'narr', t:'下課後，你拿到老師的簽名。'},
        {k:'sys', t:'必修　已選上'}
      ]);
      break;
    }
    if(v==='refresh'){
      refreshes++;
      await play([{k:'sys', t:'必修　額滿　60／60'}]);
      if(refreshes===2){ await play([{k:'them', who:'隔壁的同學', t:'你可以寫信請老師加簽啊，我去年也是這樣'}]); opts=opts.filter(o=>o.v!=='refresh'); }
      continue;
    }
    if(v==='office') await play([{k:'them', who:'系辦助教', t:'這門課每學期都有開放加簽，你直接寫信問老師就好。'},{k:'think', t:'原來還有路。'}]);
    if(v==='rum') await play([{k:'think', t:'延畢一年要多付多少學費？爸媽會怎麼想？'},{k:'narr', t:'想了一個早上，系統還是 60／60。'}]);
    opts=opts.filter(o=>o.v!==v);
  }
  await play([{k:'narr', t:'第一堂課，老師把全班分組。你和小芸、宇恩、阿哲、家豪同一組，期末要交一份報告。'}]);
  await endSolved();
}

/* 去，還是留下？ first appears at the end of September, as a quiet coda */
async function momTeaser(){
  await play([
    {k:'stamp', t:'同一週 週四 晚上'},

/* ---------- 3. 十月：the read apology (hidden: reply or not) ---------- */
async function sRead(){
  const willReply = Math.random() < .5;
  cur.hidden = willReply;
  await play([
    {k:'stamp', t:'前天 晚上 11:52'},
    {k:'me', t:'對不起，那天我不該那樣說。訂位的事是我忘了，還怪你沒提醒我，真的很幼稚。我很在乎你這個朋友，希望你不要生我的氣。', d:300},
    {k:'sys', t:'已讀'},
    {k:'stamp', t:'十月 週五 晚上 10:00', d:1200},
    {k:'narr', t: story.skipMom
      ? '那陣子你忙得團團轉，把小安生日聚餐的訂位忘得一乾二淨。他問起時，你反而怪他沒提醒你。道歉傳出去之後，到現在都沒有回。'
      : '那週你陪媽媽跑了三趟醫院，把小安生日聚餐的訂位忘得一乾二淨。他問起時，你反而怪他沒提醒你。道歉傳出去之後，到現在都沒有回。'},
    {k:'notice', app:'Instagram', title:'小安', t:'新增了一則限時動態'},
    {k:'narr', t:'照片裡，他和另外幾個朋友在吃火鍋，看起來很開心。'},
    {k:'think', t:'他看到了，只是不想回我。'}
  ]);
  await rate();
  const reply = async () => {
    await play([
      {k:'them', who:'小安', t:'抱歉這兩天很亂，一直不知道要怎麼回你', type:1500},
      {k:'them', who:'小安', t: story.skipMom ? '我那天口氣也很差啦，不是只有你的問題' : '阿凱跟我說你媽媽生病的事了。我那天口氣也很差，不是只有你的問題'},
      {k:'them', who:'小安', t:'週末一起吃飯？這次我來訂位'}
    ]);
    cur.reveal='小安不是不想回，只是還沒整理好要怎麼回。';
    return 'resolved';
  };
  const finish = async solved => {
    story.anReplied = solved;
    if(solved){ await endSolved(); return; }
    clearPin(); carry(PIN_AN);
    await play([
      {k:'stamp', t:'早上 7:30'},
      {k:'narr', t:'鬧鐘響了。你要出門上課。'},
      {k:'sys', t:'你的訊息：已讀'},
      {k:'narr', t:'你把手機放進口袋，出門。'}
    ]);
    await endTime('你沒有再傳訊息，也沒有再去看他的上線時間。是因為……');
  };
  const first = await choose([
    {t:'再傳一則：「你還在生氣嗎？」', v:'send'},
    {t:'問共同朋友阿凱', v:'mutual'},
    {t:'重讀一次自己的道歉', v:'reread'},
    {t:'先去洗澡、睡覺', v:'sleep'}
  ]);
  if(first==='send'){
    await play([{k:'me', t:'你還在生氣嗎？'},{k:'sys', t:'已讀'}]);
    if(willReply){ await reply(); return finish(true); }
  } else if(first==='mutual'){
    await play([{k:'me', t:'欸，小安有跟你說什麼嗎？'},{k:'them', who:'阿凱', t: willReply ? '他前天說心情不太好，但應該不是氣你啦' : '沒耶，他沒提'}]);
  } else if(first==='reread'){
    await play([{k:'narr', t:'你又讀了一遍。是不是寫得太長了？是不是哪一句寫錯了？'}]);
  } else {
    if(willReply){ await play([{k:'stamp', t:'早上 7:30'},{k:'narr', t:'鬧鐘響了。你拿起手機。'}]); await reply(); return finish(true); }
    await play([{k:'narr', t:'你關了燈，躺了一個小時，又把手機拿起來。'}]);
  }
  const out = await loop({
    pin:PIN_AN, rounds:2,
    stamp:['晚上 11:58','凌晨 0:47','凌晨 2:13'],
    trig:r=>[
      [{k:'notice', app:'Instagram', title:'小安', t:'又新增了一則限時動態'}],
      [{k:'sys', t:'小安 上線中'}],
      [{k:'notice', app:'LINE・高中同學', title:'阿凱', t:'週末要不要大家一起去唱歌？'}]
    ][r-1],
    thought:['他是不是還在生氣？','他是不是覺得我的道歉很假？','是不是我們就到這裡了？'],
    opts:()=>[
      {t:'寫第二則訊息', v:'draft'},
      {t:'直接再傳一則', v:'send'},
      {t:'看他最後上線的時間', v:'online'},
      {t:'重讀自己的道歉', v:'reread'},
      {t:'叫自己去睡覺', v:'sleep', cls:'quiet'}
    ],
    onPick: async (v, r) => {
      if(v==='draft') await play([{k:'draft', t:['我知道你在忙，只是想確認你有看到','如果你不想回也沒關係，我只是','你可以至少回我一個字嗎'][r-1]}]);
      if(v==='send') await play([{k:'me', t:['我真的很抱歉','你有空的時候回我一下好嗎','……'][r-1]},{k:'sys', t:'已讀'}]);
      if(v==='online') await play([{k:'sys', t:['最後上線：3 分鐘前','上線中','最後上線：1 分鐘前'][r-1]},{k:'think', t:'他明明在線上。'}]);
      if(v==='reread') await play([{k:'narr', t:'你又讀了一遍自己的道歉。每一個字都看起來不太對。'}]);
      if(v==='sleep') await play([{k:'narr', t:'你關燈，閉上眼睛。十分鐘後，螢幕又亮了，是你自己打開的。'}]);
      if(willReply && r===1) return reply();
    }
  });
  return finish(out==='resolved');
}

/* ---------- 4. 十一月：去，還是留下？（第 2 次） ---------- */

  await play([
    {k:'stamp', t:'十一月 週日 晚上'},

  ]);
  await rate();
  let aunt=false;
  let opts=[
    {t:'寫信問公司能不能改時間，或改成線上', v:'company'},
    {t:'請住附近的阿姨那天陪媽媽', v:'aunt'},

      if(v==='aunt'){ aunt=true; await play([
        {k:'me', t:'阿姨，20 號你可以陪我媽去回診嗎？'},
        {k:'them', who:'阿姨', t:'沒問題啊，我載她去，你去忙你的', type:1200},
        {k:'sys', t:'回診那天的事，解決了。'},
        {k:'think', t:'可是以後的每一次呢？'}]); }
      if(v==='ask') await play([
        {k:'me', t:'媽，20 號你希望誰陪你去？'},
        {k:'them', who:'媽媽', t: aunt ? '阿姨會載我啊，你去面試' : '我自己坐公車去就好啦', type:1500},
        {k:'narr', t:'她回得很快，好像早就想好要這樣說。'}]);
      if(v==='sign') await play([{k:'think', t:'偏偏排在同一天，是不是代表我不該去？'},{k:'think', t:'還是代表，以後每一次都會這樣？'}]);
    }
  });
  clearPin();
  if(!aunt) await play([{k:'narr', t:'最後，你請住附近的阿姨那天陪媽媽去回診。'}]);
  await play([
    {k:'stamp', t:'11/20 晚上'},
    {k:'narr', t:'面試結束了。回程的高鐵上，阿姨傳來一張照片：媽媽坐在診間外面，對著鏡頭比了一個讚。'},
    {k:'stamp', t:'晚上 9:30'},
    {k:'narr', t:'你一進門，媽媽就問面試怎麼樣。你說還不錯，然後問她：如果我真的去台北，你會怎麼樣？'},
    {k:'them', who:'媽媽', t:'會想你啊。可是想你，跟要你回來，是兩件事。', type:1600},

function curve(r, breaks){
  const W=300,H=96,pl=30,pr=12,pt=10,pb=14;
  const n=r.length, x=i=> n<2 ? pl+(W-pl-pr)/2 : pl+i*(W-pl-pr)/(n-1), y=v=> pt+(5-v)*(H-pt-pb)/4;
  let s=`<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="心裡的重量變化：${r.join('、')}">`;
  [1,3,5].forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`; });
  (breaks||[]).forEach(b=>{ const bx=(x(b-1)+x(b))/2; s+=`<line x1="${bx}" x2="${bx}" y1="${pt-4}" y2="${H-pb+4}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`; });
  s+=`<text x="0" y="${y(5)+4}" font-size="11" fill="var(--muted)">很重</text><text x="0" y="${y(1)+4}" font-size="11" fill="var(--muted)">很輕</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${r.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
  r.forEach((v,i)=>{ const last=i===n-1; s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`; });
  return s+'</svg>';
}
const ENDING = {B:['問題結束了',''], T:['時間往前了，問題還在','dash'], M:['一部分過去了，一部分還在','dash'], S:['略過','mute'], E:['日子繼續','mute']};

const OTHERS_SAID = [
];

/* four places, from how much it weighed (its heaviest moment) and whether it felt manageable */
const ZONES = [
  {n:1, title:'不太在意，也處理得來',               t:'它沒有真的壓到你。'},
  {n:2, title:'有點在意，但處理得來',               t:'佔了一點心思，但你知道下一步。'},
  {n:3, title:'有點在意，處理起來也有點麻煩、有點壓力', t:'它會回來敲門，處理它要花力氣。'},
  {n:4, title:'很在意，覺得處理不來',               t:'它很重，你也看不到能做什麼。'}
];
const peak = r => r.ratings.length ? Math.max(...r.ratings) : 0;
const lastW = r => r.ratings[r.ratings.length-1];
const label = r => `${r.month}・${r.title}`;
const span = a => { const lo=Math.min(...a), hi=Math.max(...a); return lo===hi ? `${lo}` : `${lo} 到 ${hi}`; };
const played = () => results.filter(r=>r.ending && r.ending!=='S' && r.ending!=='E' && r.ratings.length);
function zoneOf(r){
  const p=peak(r), c=r.cope||2;
  if(c===1) return p<=2 ? 1 : 2;
  if(c===2) return p<=2 ? 2 : 3;
  return p<=2 ? 1 : p===3 ? 3 : 4;
}

function zoneCard(list){
  const c=el('div','card zones');
  c.append(el('h3','','這些問題，落在你心裡的哪裡'));
  c.append(el('p','meta','依照你給的重量，和你覺得處理不處理得來。'));
  ZONES.forEach(z=>{
    const items=list.filter(r=>zoneOf(r)===z.n);
    const row=el('div','zone'+(items.length?'':' empty'));
    const lv=el('span','face-box'); const f=artImg('face-'+z.n); f.style.setProperty('--w', [64,58,66,48][z.n-1]+'px'); lv.append(f);
    const body=el('div','zone-body');
    body.append(el('strong','',esc(z.title)));
    if(items.length){
      body.append(el('p','meta',esc(z.t)));
      const tags=el('div','tags'); items.forEach(r=>tags.append(el('span','tag',esc(label(r))))); body.append(tags);
    }
    row.append(lv, body); c.append(row);
  });
  return c;
}

function miniCurve(r){
  const W=120,H=46,p=5, n=r.length, x=i=> n<2 ? W/2 : p+i*(W-2*p)/(n-1), y=v=> p+(5-v)*(H-2*p)/4;
  let s=`<svg class="mini-c" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  [1,3,5].forEach(v=>{ s+=`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`; });
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" points="${r.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
  r.forEach((v,i)=>{ const e=i===n-1; s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${e?3.6:2.2}" fill="${e?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.2"/>`; });
  return s+'</svg>';
}
function describe(list){
  const peaks=list.map(peak);
  if(peaks.every(p=>p<=2)) return ['這些情境在你心裡似乎都不算太重。'];
  const out=[];
  const solved=list.filter(r=>r.ending==='B'), open=list.filter(r=>r.ending!=='B');
  const fell = solved.every(r=>lastW(r)<peak(r)) ? '降到了' : '停在';
  if(solved.length) out.push(`有解的問題，你的重量最後${fell} ${span(solved.map(lastW))}。`);
  if(open.length) out.push(`還沒有答案的問題，它最後停在 ${span(open.map(lastW))}。`);
  return out;
}
function weightCard(list){
  const c=el('div','card');
  c.append(el('h3','','每一章的重量'));
  const grid=el('div','minis');
  list.forEach(r=>{
    const m=el('div','mini');
    m.append(el('span','mini-t',esc(label(r))));
    m.insertAdjacentHTML('beforeend', miniCurve(r.ratings));
    grid.append(m);
  });
  c.append(grid);
  c.append(el('div','mini-scale','<span>線越高，心裡越重</span>'));
  const obs=el('div','observes'); describe(list).forEach(t=>obs.append(el('p','observe',esc(t)))); c.append(obs);
  return c;
}

    good:'你會一遍一遍地想，想把事情弄清楚。這很常見，代表你很想要一個答案。',
    watch:'有些問題越想越重。研究發現，把「為什麼會這樣」換成「下一步具體做什麼」，比較容易停下來。',
    q:'如果現在只能做一件很小的事，會是什麼？'},
  carry: {name:'有解的放下，沒解的帶著', face:3,
    good:'有答案的問題，你處理完就放下了；沒有答案的，你沒有硬要解決它，而是先帶著繼續生活。',
    watch:'帶著的東西不會自己消失，偶爾需要停下來看看它。',
    q:'那個還沒有答案的問題，你想用什麼方式帶著它？'}
};
const PATTERN_ORDER = ['light','act','heart','loop','carry'];

/* what each choice says about how the player met the problem */
const KIND = {
  '寄信給授課老師，問能不能加簽':'act', '到系辦問問看':'act', '問共同朋友阿凱':'act',
  '寫信問公司能不能改時間，或改成線上':'act', '請住附近的阿姨那天陪媽媽':'act', '問媽媽希望誰陪她去':'act',
  '打開雲端，看有沒有自動備份':'act', '傳訊息問組員有沒有副本':'act', '再問媽媽一次，她真正的想法':'act',
  '一直刷新頁面，等有人退選':'loop', '開始想延畢要怎麼跟家裡說':'loop', '重讀一次自己的道歉':'loop',
  '重讀自己的道歉':'loop', '寫第二則訊息':'loop', '看他最後上線的時間':'loop', '直接再傳一則':'loop',
  '想：是不是老天在叫我別去':'loop', '拔掉隨身碟，重插一次':'loop', '開始想像上台出糗的畫面':'loop',
  '想像最壞的情況':'loop', '怪自己為什麼偏偏在這時候':'loop',
  '先去洗澡、睡覺':'rest', '叫自己去睡覺':'rest'
};

function runStats(list){
  const all=list.flatMap(r=>r.path);
  const count=k=>all.filter(t=>KIND[t]===k).length;
  const peaks=list.map(peak);
  const solved=list.filter(r=>r.ending==='B'), open=list.filter(r=>r.ending!=='B');
  return {
    n:list.length, peaks, avg:peaks.reduce((a,b)=>a+b,0)/peaks.length,
    light:peaks.filter(p=>p<=2).length, heavy:peaks.filter(p=>p>=4).length,
    act:count('act'), loop:count('loop'), rest:count('rest'),
    solved, open,
    dropped:solved.filter(r=>lastW(r)<=peak(r)-2),
    stayed:open.filter(r=>lastW(r)>=3),
    rising:list.filter(r=>r.ratings.length>2 && lastW(r)>r.ratings[0])
  };
}
function patternsOf(list){
  const s=runStats(list), fit=[];
  if(s.avg<=2.5 && s.light/s.n>=.6) fit.push('light');
  if((s.loop>=3 && s.loop>s.act) || (s.rising.length>=2 && s.loop>=2)) fit.push('loop');
  if((s.act>=3 && s.act>=s.loop*2) || (s.act>=2 && s.act>=s.loop && s.dropped.length)) fit.push('act');
  if(s.avg>=3.8) fit.push('heart');
  if(s.dropped.length && s.stayed.length) fit.push('carry');
  if(!fit.length) fit.push('carry');
  return {main:fit[0], also:fit[1]||null, s};
}
/* evidence comes only from what the player did */
function evidence(key, s){
  const lines={
    light: s.light ? `${s.n} 章裡，有 ${s.light} 章最重的時候也只到 2 以下。` : '',
    heavy: s.heavy ? `${s.n} 章裡，有 ${s.heavy} 章曾經重到 4 以上。` : '',
    act: s.act ? `遇到問題時，你有 ${s.act} 次選擇直接去問、去做。` : '',
    loop: s.loop ? `你有 ${s.loop} 次選了重讀、查看，或往壞處想。` : '',
    drop: s.dropped.length ? `「${s.dropped[0].title}」解決後，重量從 ${peak(s.dropped[0])} 降到 ${lastW(s.dropped[0])}。` : '',
    stay: s.stayed.length ? `還沒有答案的問題，最後停在 ${span(s.stayed.map(lastW))}。` : '',
    rise: s.rising.length ? `「${s.rising[0].title}」越繞越重，從 ${s.rising[0].ratings[0]} 到 ${lastW(s.rising[0])}。` : ''
  };
  const order={light:['light','drop','stay'], act:['act','drop','stay'], heart:['heavy','drop','stay'],
               loop:['loop','rise','stay'], carry:['drop','stay','act']}[key];
  return order.map(k=>lines[k]).filter(Boolean).slice(0,3);
}

function patternCard(p){
  const P=PATTERNS[p.main];
  const c=el('div','card pattern');
  /* name and evidence on the left, the figure standing beside them */
  const top=el('div','pat-top'), left=el('div','pat-left');
  const t=el('div','pat-title'); t.append(el('span','pat-k','這一次，你比較像'), el('strong','pat-name',esc(P.name).replace('，','，<br>')));
  left.append(t);
  const ev=evidence(p.main,p.s);
  if(ev.length){ const ul=el('ul','pat-ev'); ev.forEach(x=>ul.append(el('li','',esc(x)))); left.append(ul); }
  top.append(left, artImg('pat-'+p.main,'pat-face')); c.append(top);
  const g=el('div','pat-two');
  const a=el('div',''); a.append(el('span','pat-h','這樣的你'), el('p','',esc(P.good)));
  const b=el('div',''); b.append(el('span','pat-h','可以留意的'), el('p','',esc(P.watch)));
  g.append(a,b); c.append(g);
  if(p.also) c.append(el('p','pat-also',`同時，你也有一點「${esc(PATTERNS[p.also].name)}」。`));
  const q=el('div','pat-q'); q.append(el('span','',`留給自己的問題`), el('p','',esc(P.q))); c.append(q);
  c.append(el('p','fine','這是你這一次走過的樣子，不是你是哪一種人。換個心情再走一次，可能會不一樣。'));
  return c;
}

/* 你並不孤單
   收集到同學的回答後，把每一份回答最後的「這一次的樣子」數一數，填在這裡。
   total 是走過的人數；少於 3 人時，這一區不會出現。 */
const PEERS = { total: 0, light: 0, act: 0, heart: 0, loop: 0, carry: 0 };
function peersCard(p){
  if(PEERS.total<3) return null;
  const k=PEERS[p.main]||0;
  const c=el('div','card peers');
  c.append(el('h3','','你並不孤單'));
  c.append(el('p','peers-line', k
    ? `到目前為止，有 ${PEERS.total} 個人走過這個學期。其中 ${k} 個人，這一次也是「${esc(PATTERNS[p.main].name)}」。`
    : `到目前為止，有 ${PEERS.total} 個人走過這個學期。走成「${esc(PATTERNS[p.main].name)}」的，你是第一個。`));
  const bars=el('div','peer-bars');
  PATTERN_ORDER.forEach(key=>{
    const v=PEERS[key]||0, row=el('div','peer-row'+(key===p.main?' me':''));
    row.append(el('span','pr-name',esc(PATTERNS[key].name)));
    const bar=el('span','pr-bar'); const fill=el('i'); fill.style.width=(PEERS.total? v/PEERS.total*100 : 0)+'%'; bar.append(fill);
    row.append(bar, el('span','pr-n',`${v} 人`));
    bars.append(row);
  });
  c.append(bars);
  return c;
}

function momCard(){
  const ms=results.filter(r=>r.mom && r.ending!=='S');
  if(!ms.length) return null;
  const c=el('div','card thread');
  c.append(el('h3','',`一直回來的問題：「${PIN_MOM}」`));
  c.append(el('p','meta','九月第一次出現，之後又回來了。每一次，你放下它的理由都不一樣。'));
  const list=el('div','times');
  ms.forEach(m=>{
    const t=el('div','time');
    t.append(el('span','when',`${m.month}・重量 ${m.ratings.join(' → ')}`));
    if(m.reason) t.append(el('p','quote','「'+esc(m.reason)+'」'));
    list.append(t);
  });
  c.append(list);
  return c;
}

function othersCard(){
  if(!OTHERS_SAID.length) return null;
  const c=el('div','card');
  c.append(el('h3','','其他人寫下的話'));
  const box=el('div','said');
  shuffle(OTHERS_SAID).slice(0,6).forEach(o=>{
    const q=el('p','quote'); if(o.ch) q.append(el('small','',o.ch)); q.append(document.createTextNode('「'+o.t+'」')); box.append(q);
  });
  c.append(box);
  return c;
}

function summaryText(){
  const lines=['社會情緒訓練｜我的回答'];
  const pl=played(); if(pl.length) lines.push('這一次的樣子：'+PATTERNS[patternsOf(pl).main].name);
  results.forEach(r=>{
    if(r.ending==='S'){ lines.push(`${label(r)}：略過`); return; }
    const bits=[`重量 ${r.ratings.join('→')}`];
    if(r.cope) bits.push(COPE[r.cope]);
    if(r.path.length) bits.push('選了：'+r.path.join('、'));
    if(r.reason) bits.push('停下來的理由：「'+r.reason+'」');
    lines.push(`${label(r)}｜${bits.join('｜')}`);
  });
  return lines.join('\n');
}
function shareCard(){
  const c=el('div','card share');
  c.append(el('h3','','把你的回答傳給作者'));
  c.append(el('p','meta','複製後可以貼到訊息裡。你寫下的理由，之後可能會匿名出現在「其他人寫下的話」。不想分享也沒關係。'));
  const ta=el('textarea'); ta.id='shareText'; ta.readOnly=true; ta.value=summaryText(); ta.hidden=true; ta.setAttribute('aria-label','你的回答');
  const b=el('button','copy','複製我的回答'); b.type='button';
  const msg=el('span','meta'); msg.setAttribute('aria-live','polite');
  b.onclick=()=>{
    const fallback=()=>{ ta.hidden=false; ta.focus(); ta.select(); msg.textContent='請手動複製上面的文字。'; };
    try{ navigator.clipboard.writeText(ta.value).then(()=>{ msg.textContent='已複製。'; }, fallback); }catch(e){ fallback(); }
  };
  const row=el('div','share-row'); row.append(b, msg);
  c.append(ta, row);
  return c;
}

function detailCards(){
  const det=el('details','each'); det.append(el('summary','','每一章的細節'));
  const cards=el('div','cards');
  results.forEach(r=>{
    const c=el('div','card');
    const h=el('div','card-head'); h.append(el('h3','',esc(label(r))));
    const [lb, cls] = ENDING[r.ending]; h.append(el('span','chip'+(cls?' '+cls:''),lb)); c.append(h);
    if(r.ending==='E'){ c.append(el('p','meta',`最後的重量：${r.ratings.join(' → ')}`)); cards.append(c); return; }
    if(r.ending==='S'){ c.append(el('p','meta', r.mom ? '你選擇略過「去，還是留下？」這條線。' : '你選擇略過這一章。')); cards.append(c); return; }
    const parts=[`重量：${r.ratings.join(' → ')}`];
    if(r.cope) parts.push(`一開始覺得：${COPE[r.cope]}`);
    c.append(el('p','meta',parts.join('　')));
    const ol=el('ol','path'); r.path.forEach(t=>ol.append(el('li','',esc(t)))); c.append(ol);
    if(r.reason){ const q=el('p','quote'); q.append(el('small','','你停下來的理由')); q.append(document.createTextNode('「'+r.reason+'」')); c.append(q); }
    if(r.reveal) c.append(el('p','reveal','後來才知道：'+esc(r.reveal)));
    cards.append(c);
  });
  det.append(cards);
  return det;
}

function showResults(){
  const w=$('#resultWrap'); w.replaceChildren();
  const head=el('div'); head.style.display='grid'; head.style.gap='10px';
  head.append(el('p','fine','社會情緒訓練'));
  head.append(el('h1','','這是你這一個學期走過的路。'));
  head.append(el('p','lead','這裡只整理你自己給的答案，不替你下結論。'));
  w.append(head);

  const list=played();
  if(list.length){
    const pat=patternsOf(list);
    w.append(patternCard(pat));
    const pc=peersCard(pat); if(pc) w.append(pc);
    w.append(zoneCard(list)); w.append(weightCard(list));
  }
  const mc=momCard(); if(mc) w.append(mc);
  const oc=othersCard(); if(oc) w.append(oc);

  const fin=el('div','finale'); fin.setAttribute('aria-hidden','true');
  fin.append(artImg('circle','f-circle drawn'), artImg('figure-a','f-a'), artImg('figure-b','f-b'));
  w.append(fin);
  w.append(el('p','close','有些問題過去了，有些問題你帶著走。<br>它還會回來，回來的時候，你也不是原來的你了。'));

  const more=el('div','more');
  more.append(detailCards());
  const det=el('details'); det.append(el('summary','','這件作品參考的研究'));
  const ul=el('ul');
  [
    'Martin 與 Tesser（1996）：反芻會在目標達成，或目標被放下時停止。',
    'Watkins（2008）：抽象地追問「為什麼」，比具體地想「怎麼辦」更容易讓人困住。',
    'Lazarus 與 Folkman（1984）：人會先判斷一件事有多重要，再判斷自己處理不處理得來。結果頁的四個位置就是用這兩步整理的。',
    '渡邊淳一（2007）《鈍感力》：不被每件小事拉住，也是一種讓生活走得下去的能力。'
  ].forEach(t=>ul.append(el('li','',esc(t))));
  det.append(ul); more.append(det);
  w.append(more);

  w.append(shareCard());
  const again=el('button','btn','再走一次'); again.type='button'; again.onclick=()=>{ show('intro'); $('#intro').scrollTop=0; $('#intro').classList.add('go'); };
  w.append(again);
  w.append(el('p','fine','「已讀的道歉」裡對方會不會回是隨機的。這是一件互動作品，不是心理測驗或診斷。如果有某個問題已經困住你很久，找信任的人或諮商師聊聊會有幫助。'));
  show('resultScreen'); $('#resultScreen').scrollTop=0;
}

$('#startBtn').onclick = ()=>runAll(false);
$('#startSkipBtn').onclick = ()=>runAll(true);

/* opening film, then the original intro screen */
(function(){
  const film=$('#film'), v=$('#filmVideo');
  let done=false;
  /* film over (ended, skipped or failed): fade away to reveal the prologue */
  const finish=()=>{
    if(done) return; done=true;
    v.pause();
    film.classList.add('out');
    setTimeout(()=>{ film.hidden=true; }, RM ? 0 : 800);
    $('#intro').scrollTop=0; $('#intro').classList.add('go');
    $('#startBtn').focus({preventScroll:true});
  };
  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  $('#filmSkip').onclick=finish;
  const p=v.play();
  if(p && p.catch) p.catch(finish); /* autoplay blocked: go straight to the prologue */
})();
